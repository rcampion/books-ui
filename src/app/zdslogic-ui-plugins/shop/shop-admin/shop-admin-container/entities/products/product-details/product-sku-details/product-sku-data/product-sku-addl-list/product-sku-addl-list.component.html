<mat-tab-group class="custom-tabs mat-elevation-z8"> <mat-tab
	label="Additional Skus">

<div class="home-page">

	<div class="container page">

		<div>
			<a [routerLink]="['sku/create']" mat-button color="primary">
				Create Sku</a>
<!-- 
			<button mat-icon-button color="primary" matTooltip="Add book"
				(click)="redirectToAdd()">
				<mat-icon class="mat-18">add</mat-icon>
			</button>
-->
			<button mat-mini-fab matTooltip="Add Sku"
				style="margin-right: 10px; color:black; background-color: #d8d8d8"
				(click)="redirectToAdd()">
				<mat-icon>add</mat-icon>
			</button>
		</div>

		<table class="table table-striped" mat-table [dataSource]="dataSource"
			matSort>

			<ng-container matColumnDef="skuId">
			<th mat-header-cell *matHeaderCellDef mat-sort-header>Id</th>
			<td mat-cell *matCellDef="let element">{{element.skuId}}</td>
			</ng-container>


			<ng-container matColumnDef="name">
			<th mat-header-cell *matHeaderCellDef mat-sort-header>Name</th>
			<td mat-cell *matCellDef="let element">{{element.name}}</td>
			</ng-container>

			<ng-container matColumnDef="longDescription">
			<th mat-header-cell *matHeaderCellDef mat-sort-header>Description</th>
			<td mat-cell *matCellDef="let element">
				{{element.longDescription}}</td>
			</ng-container>

			<!--

	<ng-container matColumnDef="author">
	<th mat-header-cell *matHeaderCellDef mat-sort-header>Book
		Author</th>
	<td mat-cell *matCellDef="let element">
		{{element.author}}</td>
	</ng-container>
-->

			<ng-container matColumnDef="details">
			<th mat-header-cell *matHeaderCellDef>Details</th>
			<td mat-cell *matCellDef="let element">
				<button mat-icon-button color="primary"
					(click)="redirectToDetails(element.skuId)">
					<mat-icon class="mat-18">reorder</mat-icon>
				</button>
			</td>
			</ng-container>

			<ng-container matColumnDef="update">
			<th mat-header-cell *matHeaderCellDef>Update</th>
			<td mat-cell *matCellDef="let element">
				<button mat-icon-button color="accent"
					(click)="redirectToUpdate(element.skuId)">
					<mat-icon class="mat-18">system_update</mat-icon>
				</button>
			</td>
			</ng-container>

			<ng-container matColumnDef="delete">
			<th mat-header-cell *matHeaderCellDef>Delete</th>
			<td mat-cell *matCellDef="let element">
				<button mat-icon-button color="warn"
					(click)="redirectToDelete(element.skuId)">
					<mat-icon class="mat-18">delete</mat-icon>
				</button>
			</td>
			</ng-container>

			<tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
			<tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
		</table>
	</div>
</div>
<mat-paginator [length]="dataSource.total" [pageSize]="6"
	[pageSizeOptions]="[2, 4, 6, 10, 20]"> </mat-paginator> </mat-tab> </mat-tab-group>
	
</span>
