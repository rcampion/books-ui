<section fxLayout="column" fxLayoutAlign="center center">
  <h1 mat-dialog-title>Call Invite</h1>
  <mat-dialog-content>
      <p>{{data.errorMessage}}</p>
  </mat-dialog-content>
  <mat-dialog-actions>
  <button mat-raised-button color="primary" (click)="onConfirm()">Answer</button>
  <button mat-raised-button color="warn" (click)="onDismiss()">Decline</button>
   </mat-dialog-actions>
</section>
