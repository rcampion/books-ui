<div class="mx-auto flex flex-col min-w-full">
	<div class="flex flex-col px-6 sm:px-10">

		<div class="flex flex-col flex-auto w-full max-w-xs sm:max-w-5xl mx-auto">
			<div class="flex flex-auto search-component">
				<div class="flex flex-auto">
					<mat-form-field class="fuse-mat-no-subscript w-full sm:w-96 sm:mt-0" [floatLabel]="'always'">
						<mat-icon matPrefix class="icon-size-5" [svgIcon]="'heroicons_solid:search'"
							(click)="searchFormSubmitted('ALL')"></mat-icon>
						<input placeholder="Search by title or description" matInput #query id="searchQuery"
							(keyup)="searchValueChanged()" (keyup.enter)="searchFormSubmitted('ALL')" [(ngModel)]="searchString"
							name="searchString">
					</mat-form-field>
				</div>

				<button [color]="'primary'" mat-flat-button routerLink="/communicator-admin/channel/create"
					routerLinkActive="active">
					<mat-icon class="mr-2">post_add</mat-icon> Create Channel
				</button>

				<button class="ml-4" mat-mini-fab matTooltip="Add Member" (click)="redirectToAdd()">
					<mat-icon>add</mat-icon>
				</button>
			</div>
		</div>

		<div class="flex flex-col flex-auto w-full max-w-xs sm:max-w-5xl mx-auto">
			<table class="table table-striped align-middle" mat-table [dataSource]="dataSource" matSort>
				<!--  	
				<ng-container matColumnDef="firstName">
				<th mat-header-cell *matHeaderCellDef mat-sort-header>First Name</th>
				<td mat-cell *matCellDef="let element">{{element.firstName}}</td>
				</ng-container>

				<ng-container matColumnDef="lastName">
				<th mat-header-cell *matHeaderCellDef mat-sort-header>Last Name</th>
				<td mat-cell *matCellDef="let element">{{element.lastName}}</td>
				</ng-container>
			-->
				<ng-container matColumnDef="fullName">
					<th mat-header-cell *matHeaderCellDef>Full Name</th>
					<td mat-cell *matCellDef="let element">{{element.fullName}}</td>
				</ng-container>

				<ng-container matColumnDef="company">
					<th mat-header-cell *matHeaderCellDef mat-sort-header>Company</th>
					<td mat-cell *matCellDef="let element">{{element.company}}</td>
				</ng-container>

				<ng-container matColumnDef="title">
					<th mat-header-cell *matHeaderCellDef mat-sort-header>Title</th>
					<td mat-cell *matCellDef="let element">{{element.title}}</td>
				</ng-container>

				<ng-container matColumnDef="view">
					<th mat-header-cell *matHeaderCellDef>Profile</th>
					<td mat-cell matTooltip="Profile" *matCellDef="let element">
						<button mat-icon-button color="primary" (click)="redirectToProfile(element)">
							<mat-icon class="mat-18">person</mat-icon>
						</button>
					</td>
				</ng-container>

				<ng-container matColumnDef="details">
					<th mat-header-cell *matHeaderCellDef>Details</th>
					<td mat-cell matTooltip="Details" *matCellDef="let element">
						<button mat-icon-button color="primary" (click)="redirectToDetails(element)">
							<mat-icon class="mat-18">reorder</mat-icon>
						</button>
					</td>
				</ng-container>

				<ng-container matColumnDef="update">
					<th mat-header-cell *matHeaderCellDef>Update</th>
					<td mat-cell matTooltip="Update" *matCellDef="let element">
						<button mat-icon-button color="accent" (click)="redirectToUpdate(element)">
							<mat-icon class="mat-18">system_update</mat-icon>
						</button>
					</td>
				</ng-container>

				<ng-container matColumnDef="delete">
					<th mat-header-cell *matHeaderCellDef>Delete</th>
					<td mat-cell matTooltip="Delete" *matCellDef="let element">
						<button mat-icon-button color="warn" (click)="delete(element)">
							<mat-icon class="mat-18">delete</mat-icon>
						</button>
					</td>
				</ng-container>

				<tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
				<tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
			</table>
			<mat-paginator [length]="dataSource.total" [pageSize]="6" [pageSizeOptions]="[2, 4, 6, 10, 20]"> </mat-paginator>
		</div>
	</div>
</div>
