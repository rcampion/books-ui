<section class="w-full" fxLayout="row wrap" fxLayoutAlign="center center">
	<mat-card fxFlex="100%" fxFlex.xs="100%">
		<mat-card-title>Channel Details</mat-card-title>

		<form novalidate>
			<p-panel>
				<mat-card-content>

					<div fxLayout="column wrap" fxLayoutAlign="center start">
						<div fxLayout="row wrap" fxFlex>
							<div class="min-w-52 text-left">
								<strong>Channel name:</strong>
							</div>
							<div fxFlex>{{chatChannel?.channelName}}</div>
						</div>

						<div fxLayout="row wrap" fxFlex>
							<div class="min-w-52 text-left">
								<strong>Channel description:</strong>
							</div>
							<div fxFlex>{{chatChannel?.description}}</div>
						</div>
					</div>
				</mat-card-content> 
				<!--
					<mat-card-actions>
						<mat-form-field>
							<mat-select placeholder="Show accounts" (selectionChange)="onChange($event)">
								<mat-option *ngFor="let opt of selectOptions" [value]="opt.value">
									{{opt.name}}
								</mat-option>
							</mat-select>
						</mat-form-field>
					</mat-card-actions>
        --> 
				<mat-card-actions>
					<button mat-raised-button color="primary" (click)="onCancel()">OK</button>
				</mat-card-actions>
			</p-panel>
		</form>

	</mat-card>
</section>
