<section class="w-full" fxLayout="row wrap" fxLayoutAlign="center center">
	<mat-card fxFlex="100%" fxFlex.xs="100%">
		<mat-card-title>Message Details</mat-card-title>
		<!-- Contact -->
		<div class="flex flex-col flex-auto items-center bg-card shadow rounded-2xl overflow-hidden justify-between">
			<!-- Status & Action -->
			<div class="flex flex-auto w-full p-4 pb-0 justify-end items-center max-h-12">
				<button [ngClass]="getStatusClass(contact.presenceStatus)" class="max-h-8 rounded-md py-1 px-5 mr-2">
					{{ getStatusName(contact.presenceStatus) }}
				</button>
				<!--
								<button
										mat-icon-button
										[matMenuTriggerFor]="contactAction">
										<mat-icon
												class="icon-size-5"
												[svgIcon]="'heroicons_solid:dots-vertical'"></mat-icon>
								</button>
								<mat-menu #contactAction="matMenu">
										<button mat-menu-item></button>
								</mat-menu>
-->
			</div>
			<!-- Avatar & Info -->
			<div class="flex flex-col w-full p-4 text-center">
				<div class="w-32 h-32 mx-auto rounded-full overflow-hidden">
					<ng-container *ngIf="contact.imageURL">
						<img class="w-full h-full object-cover" [src]="contact.imageURL" alt="element avatar" />
					</ng-container>
					<ng-container *ngIf="!contact.imageURL">
						<div class="w-full h-full object-cover">
							{{contact.fullName.charAt(0)}}
						</div>
					</ng-container>
				</div>
				<div class="mt-6 text-xl text-blue-700">{{contact.fullName}}</div>
				<div class="text-base text-slate-700">{{contact.title}}</div>
				<div class="text-sm text-slate-500">{{contact.company}}</div>
			</div>

			<!-- Email & Phone -->
			<div class="contact-actions flex items-center justify-between w-full border-t divide-x p-4">
				<button class="videocam p-2 hover:bg-hover" (click)="redirectToVideo(contact)">
					<mat-icon class="flex items-center icon-size-5 text-hint"
						[svgIcon]="'heroicons_solid:video-camera'">videocam</mat-icon>
				</button>
				<button class="person p-2 hover:bg-hover" (click)="redirectToProfile(contact)">
					<mat-icon class="flex items-center icon-size-5 text-hint"
						[svgIcon]="'heroicons_solid:user'">person</mat-icon>
				</button>
				<button class="system_udpate p-2 hover:bg-hover" (click)="redirectToDetails(contact)">
					<mat-icon class="flex items-center icon-size-5 text-hint mat-18">reorder</mat-icon>
				</button>
				<!--
								<button 
									class="delete p-2 hover:bg-hover"
									(click)="delete(contact)">
									<mat-icon class="flex items-center icon-size-5 text-hint" [svgIcon]="'heroicons_solid:trash'">delete</mat-icon>
								</button>
-->
			</div>
		</div>
		
		<form novalidate>
			<p-panel>
				<mat-card-content>

					<div fxLayout="column wrap" fxLayoutAlign="center start">
						<div fxLayout="row wrap" fxFlex>
							<div class="min-w-52 text-left">
								<strong>From:</strong>
							</div>
							<div fxFlex>{{chatMessage?.fromText}}</div>
						</div>

						<div fxLayout="row wrap" fxFlex>
							<div class="min-w-52 text-left">
								<strong>Message:</strong>
							</div>
							<div fxFlex>{{chatMessage?.message}}</div>
						</div>
					</div>
				</mat-card-content>
				<!--
					<mat-card-actions>
						<mat-form-field>
							<mat-select placeholder="Show accounts" (selectionChange)="onChange($event)">
								<mat-option *ngFor="let opt of selectOptions" [value]="opt.value">
									{{opt.name}}
								</mat-option>
							</mat-select>
						</mat-form-field>
					</mat-card-actions>
        -->
				<mat-card-actions>
					<button mat-raised-button color="primary" (click)="onCancel()">OK</button>
				</mat-card-actions>
			</p-panel>
		</form>

	</mat-card>
</section>
