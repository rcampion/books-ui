
<table class="table table-striped" mat-table [dataSource]="dataSource"
	matSort>
	<ng-container matColumnDef="attachment">
	<th mat-header-cell *matHeaderCellDef mat-sort-header>Attachment</th>
	<td mat-cell *matCellDef="let element">{{element.attachment}}</td>
	</ng-container>
	
	<ng-container matColumnDef="download">
	<th mat-header-cell *matHeaderCellDef>Download</th>
	<td mat-cell *matCellDef="let element">
		<button mat-icon-button color="accent"
			(click)="redirectToDownload(element.id)">
			<mat-icon class="mat-18">system_update</mat-icon>
		</button>
	</td>
	</ng-container>
	
	<tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
	<tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
</table>
