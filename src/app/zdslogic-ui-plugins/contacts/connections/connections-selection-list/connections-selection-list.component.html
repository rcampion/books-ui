<div class="home-page">

	<div class="container page">

		<div class="search-component container-fluid">		

			<div class="flex items-center mt-4 sm:mt-0 md:mt-4 mb-3">
				<div class="flex-auto">
					<mat-form-field class="fuse-mat-dense fuse-mat-no-subscript fuse-mat-rounded w-full min-w-50">
						<mat-icon (click)="searchFormSubmitted('ALL')" class="icon-size-5" matPrefix
							[svgIcon]="'heroicons_solid:search'"></mat-icon>
						<input matInput [autocomplete]="'off'" [placeholder]="'Search connections'"
							(keyup)="searchValueChanged()" (keyup.enter)="searchFormSubmitted('ALL')" [(ngModel)]="searchString"
							name="searchString">
					</mat-form-field>
				</div>
			</div>
		</div>

		<table class="table table-striped align-middle" mat-table [dataSource]="dataSource"
			matSort>

			<ng-container matColumnDef="fullName">
			<th mat-header-cell *matHeaderCellDef mat-sort-header>Full Name
			</th>
			<td mat-cell *matCellDef="let element">{{element.fullName}}</td>
			</ng-container>
			<!--
  <ng-container matColumnDef="lastName">
    <th mat-header-cell *matHeaderCellDef mat-sort-header> Last Name </th>
    <td mat-cell *matCellDef="let element"> {{element.lastName}} </td>
  </ng-container>
-->
			<ng-container matColumnDef="company">
			<th mat-header-cell *matHeaderCellDef mat-sort-header>Company</th>
			<td mat-cell *matCellDef="let element">{{element.company}}</td>
			</ng-container>

			<ng-container matColumnDef="add">
			<th mat-header-cell *matHeaderCellDef>Add</th>
			<td mat-cell *matCellDef="let element">
<!--
				<button mat-icon-button color="primary"
					(click)="addUserContact(element.id)">
					<mat-icon class="mat-18">add</mat-icon>
				</button>
-->
				<button mat-mini-fab matTooltip="Add Connection"
					style="margin-right: 10px; color:black; background-color: #d8d8d8"
					(click)="addUserContact(element.id)">
					<mat-icon>add</mat-icon>
				</button>
			</td>
			</ng-container>

			<tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
			<tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
		</table>
	</div>
</div>

<mat-paginator [pageSize]="6" [pageSizeOptions]="[2, 4, 6, 10, 20]">
</mat-paginator>
