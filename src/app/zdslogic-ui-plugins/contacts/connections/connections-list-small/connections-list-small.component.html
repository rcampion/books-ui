<h4 class="mb-3 align-center"> Connections </h4>

<div class="mt-2" [hidden]="isUserLoggedIn" fxLayout fxLayoutAlign="center center">
	<br>
	<div align="left">
		<button mat-raised-button color="primary" (click)="loginSSO()" class="mr-3">
			<mat-icon class="mr-1">login</mat-icon> Sign In
		</button>
		<button type="button" mat-raised-button color="warn" (click)="redirectToRegister()">
			<mat-icon class="mr-1">add</mat-icon> Sign Up
		</button>
	</div>
</div>

<div [hidden]="!isUserLoggedIn">
	<div fxLayout fxLayoutAlign="center center">
		<table>
			<tr>
				<td>
					<div class="flex items-center mt-4 sm:mt-0 md:mt-4 mb-3">
						<div class="flex-auto">
							<mat-form-field class="fuse-mat-dense fuse-mat-no-subscript fuse-mat-rounded w-full min-w-50">
								<mat-icon (click)="searchFormSubmitted('ALL')" class="icon-size-5" matPrefix
									[svgIcon]="'heroicons_solid:search'"></mat-icon>
								<input matInput [autocomplete]="'off'" [placeholder]="'Search connections'"
									(keyup)="searchValueChanged()" (keyup.enter)="searchFormSubmitted('ALL')" [(ngModel)]="searchString"
									name="searchString">
							</mat-form-field>
						</div>

						<a [routerLink]="['/contacts/contact/create']">
							<button class="ml-4 mr-2" mat-flat-button [color]="'primary'" (click)="redirectToAdd()">
								<span class="ml-2 mr-1">Create Connection</span>
							</button>
						</a>

						<button mat-mini-fab matTooltip="Add Connection" (click)="redirectToAdd()">
							<mat-icon [svgIcon]="'heroicons_outline:plus'"></mat-icon>
						</button>
					</div>
				</td>
			</tr>
		</table>
	</div>

	<table class="table table-striped align-middle" mat-table [dataSource]="dataSource" matSort>		
		<ng-container matColumnDef="presenceImageUrl">
			<th mat-header-cell *matHeaderCellDef></th>
			<td mat-cell matTooltip="Status" *matCellDef="let element">
				<img class="status_badge" [src]="element.presenceImageUrl" />
			</td>
		</ng-container>		
		<ng-container matColumnDef="imageURL">
			<th mat-header-cell *matHeaderCellDef></th>
			<td mat-cell class="nav-link" *matCellDef="let element">
				<!-- <img [src]="element.imageURL" class="user-pic" />
				<mat-icon *ngIf="!element.imageURL" [svgIcon]="'heroicons_outline:user-circle'" class="user-pic"></mat-icon> -->
				<div class="items-center justify-center w-8 h-8 my-1 rounded-full overflow-hidden">
					<ng-container *ngIf="element.imageURL">
							<img
									class="object-cover w-full h-full"
									[src]="element.imageURL"
									alt="Contact avatar"/>
					</ng-container>
					<ng-container *ngIf="!element.imageURL">
							<div class="flex items-center justify-center w-full h-full rounded-full text-lg uppercase bg-gray-200 text-gray-600 dark:bg-gray-700 dark:text-gray-200">
									{{element.fullName.charAt(0)}}
							</div>
					</ng-container>
				</div>
			</td>
		</ng-container>
		<!--		
		<ng-container matColumnDef="firstName">
		<th mat-header-cell *matHeaderCellDef mat-sort-header>First Name</th>
		<td mat-cell *matCellDef="let element">{{element.firstName}}</td>
		</ng-container>

		<ng-container matColumnDef="lastName">
		<th mat-header-cell *matHeaderCellDef mat-sort-header>Last Name</th>
		<td mat-cell *matCellDef="let element">{{element.lastName}}</td>
		</ng-container>
-->
		<ng-container matColumnDef="fullName">
			<th mat-header-cell *matHeaderCellDef mat-sort-header>Full Name</th>
			<td mat-cell *matCellDef="let element" class="pl-3">{{element.fullName}}</td>
		</ng-container>

		<ng-container matColumnDef="video">
			<th mat-header-cell *matHeaderCellDef></th>
			<td mat-cell matTooltip="Video" *matCellDef="let element">
				<button mat-icon-button color="primary" (click)="redirectToVideo(element)">
					<mat-icon class="mat-18">videocam</mat-icon>
				</button>
			</td>
		</ng-container>
		<!--
  <ng-container matColumnDef="company">
    <th mat-header-cell *matHeaderCellDef mat-sort-header> Company </th>
    <td mat-cell *matCellDef="let element"> {{element.company}} </td>
  </ng-container>
-->
		<ng-container matColumnDef="details">
			<th mat-header-cell *matHeaderCellDef></th>
			<td mat-cell matTooltip="Details" *matCellDef="let element">
				<button mat-icon-button color="primary" (click)="redirectToDetails(element)">
					<mat-icon class="mat-18">reorder</mat-icon>
				</button>
			</td>
		</ng-container>
		<!--
  <ng-container matColumnDef="update">
    <th mat-header-cell *matHeaderCellDef> Update </th>
    <td mat-cell *matCellDef="let element">
      <button mat-icon-button color="accent" (click)="redirectToUpdate(element)">
        <mat-icon class="mat-18">system_update</mat-icon>
      </button>
    </td>
  </ng-container>
-->
		<ng-container matColumnDef="delete">
			<th mat-header-cell *matHeaderCellDef></th>
			<td mat-cell matTooltip="Delete" *matCellDef="let element">
				<button mat-icon-button color="warn" (click)="delete(element)">
					<mat-icon class="mat-18">delete</mat-icon>
				</button>
			</td>
		</ng-container>

		<tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
		<!--
  <tr mat-row *matRowDef="let row; columns: displayedColumns;" (click)="redirectToDetails(row)"></tr>
-->
		<tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
	</table>

	<mat-paginator [length]="dataSource.total" [pageSize]="6" [pageSizeOptions]="[2, 4, 6, 10, 20]"> </mat-paginator>
</div>
