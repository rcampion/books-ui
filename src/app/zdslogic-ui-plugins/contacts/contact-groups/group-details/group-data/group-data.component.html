<section class="w-full" fxLayout="row wrap" fxLayoutAlign="center center">
	<mat-card fxFlex="100%" fxFlex.xs="100%">
			<mat-card-title>Group Details</mat-card-title>
			<form novalidate>
				<p-panel>
					<mat-card-content>				
						<div fxLayout="column wrap" fxLayoutAlign="center start">
							<div fxLayout="row wrap">
								<div class="min-w-36 text-left">
									<strong>Group name:</strong>
								</div>
								<div fxFlex>{{group?.groupName}}</div>
							</div>

							<div fxLayout="row wrap">
								<div class="min-w-36 text-left">
									<strong>Group description:</strong>
								</div>
								<div fxFlex>{{group?.groupDescription}}</div>
							</div>
						</div>
						
					</mat-card-content> <!--
						<mat-card-actions>
							<mat-form-field>
								<mat-select placeholder="Show accounts" (selectionChange)="onChange($event)">
									<mat-option *ngFor="let opt of selectOptions" [value]="opt.value">
										{{opt.name}}
									</mat-option>
								</mat-select>
							</mat-form-field>
						</mat-card-actions>
						--> <mat-card-actions>
					<button mat-raised-button color="primary" (click)="onCancel()">OK</button>
					</mat-card-actions> 
				</p-panel>
			</form>
		</mat-card>
</section>
