<div class="flex flex-auto items-center gap-3">
	<span>Add Address</span>
<!--	
	<button mat-icon-button color="primary" matTooltip="Add note"
		(click)="redirectToAdd()">
		<mat-icon class="mat-18">add</mat-icon>
	</button>
	-->
	<button mat-mini-fab matTooltip="Add Address"
		style="margin-right: 10px; color:black; background-color: #d8d8d8"
		(click)="redirectToAdd()">
		<mat-icon>add</mat-icon>
	</button>

</div>
<table class="table table-striped align-middle" mat-table [dataSource]="dataSource"
	matSort>
	<ng-container matColumnDef="addressLine1">
	<th mat-header-cell *matHeaderCellDef mat-sort-header>Address Line
		1</th>
	<td mat-cell *matCellDef="let element">{{element.addressLine1}}</td>
	</ng-container>

	<ng-container matColumnDef="addressLine2">
	<th mat-header-cell *matHeaderCellDef mat-sort-header>Address Line
		2</th>
	<td mat-cell *matCellDef="let element">{{element.addressLine2}}</td>
	</ng-container>

	<ng-container matColumnDef="addressCity">
	<th mat-header-cell *matHeaderCellDef mat-sort-header>City</th>
	<td mat-cell *matCellDef="let element">{{element.addressCity}}</td>
	</ng-container>

	<ng-container matColumnDef="addressState">
	<th mat-header-cell *matHeaderCellDef mat-sort-header>State</th>
	<td mat-cell *matCellDef="let element">{{element.addressState}}</td>
	</ng-container>

	<ng-container matColumnDef="addressZip">
	<th mat-header-cell *matHeaderCellDef mat-sort-header>Zip</th>
	<td mat-cell *matCellDef="let element">{{element.addressZip}}</td>
	</ng-container>

	<ng-container matColumnDef="addressKind">
	<th mat-header-cell *matHeaderCellDef mat-sort-header>Address Type
	</th>
	<td mat-cell *matCellDef="let element"><mat-select
			[value]="element.addressKind" [disabled]="true"> <mat-option
			*ngFor="let addressSelect of addressTypes"
			[value]="addressSelect.value">
		{{addressSelect.viewValue}} </mat-option> </mat-select></td>
	</ng-container>

	<ng-container matColumnDef="details">
	<th mat-header-cell *matHeaderCellDef>Details</th>
	<td mat-cell *matCellDef="let element">
		<button mat-icon-button color="primary"
			(click)="redirectToDetails(element.addressId)">
			<mat-icon class="mat-18">reorder</mat-icon>
		</button>
	</td>
	</ng-container>

	<ng-container matColumnDef="update">
	<th mat-header-cell *matHeaderCellDef>Update</th>
	<td mat-cell *matCellDef="let element">
		<button mat-icon-button color="accent"
			(click)="redirectToUpdate(element.addressId)">
			<mat-icon class="mat-18">system_update</mat-icon>
		</button>
	</td>
	</ng-container>

	<ng-container matColumnDef="delete">
	<th mat-header-cell *matHeaderCellDef>Delete</th>
	<td mat-cell *matCellDef="let element">
		<button mat-icon-button color="warn"
			(click)="delete(element.addressId)">
			<mat-icon class="mat-18">delete</mat-icon>
		</button>
	</td>
	</ng-container>

	<tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
	<tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
</table>
