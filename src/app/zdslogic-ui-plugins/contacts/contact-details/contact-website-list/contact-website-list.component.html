<div class="flex flex-auto items-center gap-3">
	<span>Add Website</span>
<!--
	<button mat-icon-button color="primary" matTooltip="Add website"
		(click)="redirectToAdd()">
		<mat-icon class="mat-18">add</mat-icon>
	</button>
-->
	<button mat-mini-fab matTooltip="Add Website"
		style="margin-right: 10px; color:black; background-color: #d8d8d8"
		(click)="redirectToAdd()">
		<mat-icon>add</mat-icon>
	</button>

</div>

<table class="table table-striped align-middle" mat-table [dataSource]="dataSource"
	matSort>
	<ng-container matColumnDef="website">
	<th mat-header-cell *matHeaderCellDef mat-sort-header>Website</th>
	<td mat-cell *matCellDef="let element">{{element.website}}</td>
	</ng-container>

	<ng-container matColumnDef="websiteKind">
	<th mat-header-cell *matHeaderCellDef mat-sort-header>Website Type
	</th>
	<td mat-cell *matCellDef="let element"><mat-select
			[value]="element.websiteKind" [disabled]="true"> <mat-option
			*ngFor="let websiteSelect of websiteTypes"
			[value]="websiteSelect.value">
		{{websiteSelect.viewValue}} </mat-option> </mat-select></td>
	</ng-container>

	<ng-container matColumnDef="update">
	<th mat-header-cell *matHeaderCellDef>Update</th>
	<td mat-cell *matCellDef="let element">
		<button mat-icon-button color="accent"
			(click)="redirectToUpdate(element.websiteId)">
			<mat-icon class="mat-18">system_update</mat-icon>
		</button>
	</td>
	</ng-container>

	<ng-container matColumnDef="delete">
	<th mat-header-cell *matHeaderCellDef>Delete</th>
	<td mat-cell *matCellDef="let element">
		<button mat-icon-button color="warn"
			(click)="delete(element.websiteId)">
			<mat-icon class="mat-18">delete</mat-icon>
		</button>
	</td>
	</ng-container>

	<tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
	<tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
</table>
