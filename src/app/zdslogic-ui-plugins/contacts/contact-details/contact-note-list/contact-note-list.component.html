<div class="flex flex-auto items-center gap-3">
	<span>Add Note</span>
<!--
	<button mat-icon-button color="primary" matTooltip="Add note"
		(click)="redirectToAdd()">
		<mat-icon class="mat-18">add</mat-icon>
	</button>
-->
	<button mat-mini-fab matTooltip="Add Note"
		style="margin-right: 10px; color:black; background-color: #d8d8d8"
		(click)="redirectToAdd()">
		<mat-icon>add</mat-icon>
	</button>

</div>
<table class="table table-striped align-middle" mat-table [dataSource]="dataSource"
	matSort>
	<ng-container matColumnDef="createdAt">
	<th mat-header-cell *matHeaderCellDef mat-sort-header>Date Created</th>
	<td mat-cell *matCellDef="let element">{{element.createdAt |
		date:'short'}}</td>
	</ng-container>

	<ng-container matColumnDef="updatedAt">
	<th mat-header-cell *matHeaderCellDef mat-sort-header>Date Updated</th>
	<td mat-cell *matCellDef="let element">{{element.updatedAt |
		date:'short'}}</td>
	</ng-container>

	<ng-container matColumnDef="description">
	<th mat-header-cell *matHeaderCellDef mat-sort-header>Dscription</th>
	<td mat-cell *matCellDef="let element">{{element.description}}</td>
	</ng-container>

	<ng-container matColumnDef="details">
	<th mat-header-cell *matHeaderCellDef>Details</th>
	<td mat-cell *matCellDef="let element">
		<button mat-icon-button color="primary"
			(click)="redirectToDetails(element.id)">
			<mat-icon class="mat-18">reorder</mat-icon>
		</button>
	</td>
	</ng-container>

	<ng-container matColumnDef="update">
	<th mat-header-cell *matHeaderCellDef>Update</th>
	<td mat-cell *matCellDef="let element">
		<button mat-icon-button color="accent"
			(click)="redirectToUpdate(element.id)">
			<mat-icon class="mat-18">system_update</mat-icon>
		</button>
	</td>
	</ng-container>

	<ng-container matColumnDef="delete">
	<th mat-header-cell *matHeaderCellDef>Delete</th>
	<td mat-cell *matCellDef="let element">
		<button mat-icon-button color="warn" (click)="delete(element.id)">
			<mat-icon class="mat-18">delete</mat-icon>
		</button>
	</td>
	</ng-container>

	<tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
	<tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
</table>
